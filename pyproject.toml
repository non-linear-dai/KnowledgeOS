[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgeos"
version = "4.0.0"
description = "KnowledgeOS Python backend"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "jsonschema>=4,<5", "rdflib>=7.6,<8", "pyshacl>=0.40,<0.41"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
knowledgeos = "knowledge_os.cli:main"
knowledgeos-assistant = "knowledgeos_assistant.gateway:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["pytests"]
