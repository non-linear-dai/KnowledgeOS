name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec ruby -Ilib bin/knowledgeos doctor
      - run: bundle exec ruby -Ilib bin/knowledgeos rebuild
      - run: bundle exec ruby -Ilib bin/knowledgeos verify-ledger

