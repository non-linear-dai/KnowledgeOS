concept_types:
  - id: organization
    label: Organization
    description: Enterprise, supplier, and partner identity.
    status: { lifecycle: active, equivalent_to: }
    properties:
      - { predicate: legal_name, required: true, cardinality: inherit, group: identity }
      - { predicate: country, required: false, cardinality: inherit, group: profile }
      - { predicate: finding, required: false, cardinality: inherit, group: governance }
      - { predicate: lead_time_days, required: false, cardinality: inherit, group: measurement }
  - id: market
    label: Market
    description: A research subject and bounded market scope.
    status: { lifecycle: active, equivalent_to: }
    properties:
      - { predicate: summary, required: false, cardinality: inherit, group: profile }
      - { predicate: market_size, required: false, cardinality: inherit, group: measurement }
      - { predicate: finding, required: false, cardinality: inherit, group: governance }
  - id: product
    label: Product
    description: A product that may be analyzed, supplied, or used.
    status: { lifecycle: active, equivalent_to: }
    properties:
      - { predicate: summary, required: false, cardinality: inherit, group: profile }
      - { predicate: unit_cost, required: false, cardinality: inherit, group: measurement }
      - { predicate: lead_time_days, required: false, cardinality: inherit, group: measurement }
  - id: project
    label: Project
    description: A governed project work unit.
    status: { lifecycle: active, equivalent_to: }
    properties:
      - { predicate: summary, required: false, cardinality: inherit, group: profile }
      - { predicate: risk_level, required: false, cardinality: inherit, group: governance }
  - id: task
    label: Task
    description: A trackable task or milestone within a project.
    status: { lifecycle: active, equivalent_to: }
    properties:
      - { predicate: summary, required: false, cardinality: inherit, group: profile }
      - { predicate: task_status, required: true, cardinality: inherit, group: governance }
      - { predicate: risk_level, required: false, cardinality: inherit, group: governance }
  - id: relation
    label: Reified Relation
    description: A relation promoted to a node because it needs identity, evidence, or temporal state.
    status: { lifecycle: active, equivalent_to: }
    properties:
      - { predicate: lead_time_days, required: false, cardinality: inherit, group: measurement }
      - { predicate: risk_level, required: false, cardinality: inherit, group: governance }
  - id: decision
    label: Decision
    description: A governed business or research decision.
    status: { lifecycle: active, equivalent_to: }
    properties:
      - { predicate: summary, required: false, cardinality: inherit, group: profile }
      - { predicate: finding, required: false, cardinality: inherit, group: governance }
      - { predicate: risk_level, required: false, cardinality: inherit, group: governance }
  - id: equipment
    label: Equipment
    description: Capital equipment with measured properties and governed costing parameters.
    status: { lifecycle: active, equivalent_to: }
    properties:
      - { predicate: rated_power, required: false, cardinality: inherit, group: measurement }
      - { predicate: acquisition_cost, required: false, cardinality: inherit, group: measurement }
      - { predicate: residual_value, required: false, cardinality: inherit, group: measurement }
      - { predicate: useful_life_hours, required: false, cardinality: inherit, group: measurement }
      - { predicate: utilization_factor, required: false, cardinality: inherit, group: measurement }
      - { predicate: depreciation_cost_per_hour, required: false, cardinality: inherit, group: measurement }
  - id: exchange_quote
    label: Exchange quote
    description: Source-backed currency pair quote at a declared business time.
    status: { lifecycle: active, equivalent_to: }
    properties:
      - { predicate: exchange_rate, required: false, cardinality: inherit, group: measurement }
  - id: route_template
    label: Route template
    description: Expert-approved, versioned manufacturing route composed of groups and step occurrences.
    status: { lifecycle: active, equivalent_to: }
    properties:
      - { predicate: template_family, required: true, cardinality: one, group: profile }
      - { predicate: template_version, required: true, cardinality: one, group: governance }
      - { predicate: output_basis, required: true, cardinality: one, group: measurement }
      - { predicate: template_cases, required: true, cardinality: one, group: governance }
      - { predicate: template_author, required: true, cardinality: one, group: governance }
      - { predicate: decision_assets, required: false, cardinality: one, group: governance }
      - { predicate: summary, required: false, cardinality: inherit, group: profile }
  - id: route_group
    label: Route group
    description: Non-cost-bearing repeat or branch container within a route template.
    status: { lifecycle: active, equivalent_to: }
    properties:
      - { predicate: route_key, required: true, cardinality: one, group: identity }
      - { predicate: iteration_set, required: true, cardinality: one, group: profile }
      - { predicate: join_policy, required: true, cardinality: one, group: profile }
      - { predicate: group_execution, required: false, cardinality: one, group: profile }
      - { predicate: decision_binding, required: false, cardinality: one, group: profile }
      - { predicate: template_condition, required: false, cardinality: one, group: profile }
  - id: route_step
    label: Route step
    description: One occurrence of a reusable operation template in a manufacturing route.
    status: { lifecycle: active, equivalent_to: }
    properties:
      - { predicate: route_key, required: true, cardinality: one, group: identity }
      - { predicate: cost_basis, required: true, cardinality: one, group: measurement }
      - { predicate: template_condition, required: false, cardinality: one, group: profile }
      - { predicate: decision_binding, required: false, cardinality: one, group: profile }
  - id: operation_template
    label: Operation template
    description: Reusable expert-authored standard operation referenced by route steps.
    status: { lifecycle: active, equivalent_to: }
    properties:
      - { predicate: cost_basis, required: true, cardinality: one, group: measurement }
      - { predicate: operation_method, required: false, cardinality: one, group: profile }
      - { predicate: resource_plan, required: false, cardinality: one, group: measurement }
      - { predicate: time_model_ref, required: false, cardinality: one, group: measurement }
      - { predicate: operation_processing, required: false, cardinality: one, group: measurement }
      - { predicate: summary, required: false, cardinality: inherit, group: profile }
  - id: decision_table
    label: Decision table
    description: Reusable expert-authored decision table with typed rules and a deterministic hit policy.
    status: { lifecycle: active, equivalent_to: }
    properties:
      - { predicate: decision_definition, required: true, cardinality: one, group: profile }

relation_types:
  - id: participates_in
    label: participates in
    description: Connects an organization or product to a market.
    status: { lifecycle: active, equivalent_to: }
    mode: simple
    connections:
      - { source_type: organization, target_type: market, source_cardinality: many, target_cardinality: many }
      - { source_type: product, target_type: market, source_cardinality: many, target_cardinality: many }
  - id: supplies
    label: supplies
    description: Connects a supplier organization to a product.
    status: { lifecycle: active, equivalent_to: }
    mode: reifiable
    connections:
      - { source_type: organization, target_type: product, source_cardinality: many, target_cardinality: many }
    reification:
      node_type: relation
      identity: required
      properties:
        - { predicate: lead_time_days, required: false, cardinality: inherit, group: measurement }
        - { predicate: risk_level, required: false, cardinality: inherit, group: governance }
  - id: contains
    label: contains
    description: Connects a project or composition to its contained work or component.
    status: { lifecycle: active, equivalent_to: }
    mode: simple
    connections:
      - { source_type: project, target_type: task, source_cardinality: one, target_cardinality: many }
  - id: depends_on
    label: depends on
    description: Connects tasks to task or organization dependencies.
    status: { lifecycle: active, equivalent_to: }
    mode: simple
    connections:
      - { source_type: task, target_type: task, source_cardinality: many, target_cardinality: many }
      - { source_type: task, target_type: organization, source_cardinality: many, target_cardinality: many }
  - id: uses
    label: uses
    description: Connects products to component products or provider organizations they use.
    status: { lifecycle: active, equivalent_to: }
    mode: simple
    connections:
      - { source_type: product, target_type: product, source_cardinality: many, target_cardinality: many }
      - { source_type: product, target_type: organization, source_cardinality: many, target_cardinality: many }
  - id: threatens
    label: threatens
    description: Connects a reified risk relation to a governed project or task.
    status: { lifecycle: active, equivalent_to: }
    mode: reified
    connections:
      - { source_type: relation, target_type: project, source_cardinality: many, target_cardinality: many }
      - { source_type: relation, target_type: task, source_cardinality: many, target_cardinality: many }
    reification:
      node_type: relation
      identity: required
      properties:
        - { predicate: risk_level, required: true, cardinality: inherit, group: governance }
  - id: route_contains
    label: route contains
    description: Owns a top-level group or step occurrence in a route.
    status: { lifecycle: active, equivalent_to: }
    mode: simple
    connections:
      - { source_type: route_template, target_type: route_group, source_cardinality: one, target_cardinality: many }
      - { source_type: route_template, target_type: route_step, source_cardinality: one, target_cardinality: many }
  - id: group_contains
    label: group contains
    description: Owns a step occurrence within a repeating group.
    status: { lifecycle: active, equivalent_to: }
    mode: simple
    connections:
      - { source_type: route_group, target_type: route_step, source_cardinality: one, target_cardinality: many }
  - id: route_precedes
    label: route precedes
    description: Requires one route group or step to finish before another at the same nesting level.
    status: { lifecycle: active, equivalent_to: }
    mode: simple
    connections:
      - { source_type: route_group, target_type: route_group, source_cardinality: many, target_cardinality: many }
      - { source_type: route_group, target_type: route_step, source_cardinality: many, target_cardinality: many }
      - { source_type: route_step, target_type: route_group, source_cardinality: many, target_cardinality: many }
      - { source_type: route_step, target_type: route_step, source_cardinality: many, target_cardinality: many }
  - id: route_uses_operation
    label: route uses operation
    description: Binds a route step occurrence to one version-pinned reusable operation template.
    status: { lifecycle: active, equivalent_to: }
    mode: simple
    connections:
      - { source_type: route_step, target_type: operation_template, source_cardinality: many, target_cardinality: one }
